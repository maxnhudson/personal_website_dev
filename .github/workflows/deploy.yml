name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; queue instead of cancelling mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mushroom-tracker/package-lock.json
            personal-website-vue/package-lock.json

      # Build the tracker into the Vue public folder first, so the Vue build
      # picks it up and copies it into dist
      - name: Build Mushroom Tracker
        working-directory: mushroom-tracker
        run: npm ci && npm run build

      - name: Build Vue app
        working-directory: personal-website-vue
        run: npm ci && npm run build
        env:
          # Set to /<repo-name>/ when deploying this repo's own Pages site.
          # Leave unset for a user site served from the domain root.
          PUBLIC_PATH: ${{ vars.PUBLIC_PATH }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal-website-vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4