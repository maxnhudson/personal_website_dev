
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mushroom-tracker/package-lock.json
            Personal-Website/package-lock.json

      # Step 1: Build the Personal Website first so it creates a clean 'dist' folder
      - name: Build Vue app
        working-directory: Personal-Website
        run: npm ci && npm run build
        env:
          PUBLIC_PATH: ${{ vars.PUBLIC_PATH }}

      # Step 2: Build the Mushroom Tracker independently
      - name: Build Mushroom Tracker
        working-directory: mushroom-tracker
        run: npm ci && npm run build

      # Step 3: Explicitly move the tracker build into the Vue app's dist folder
      # This creates dist/mushroom-tracker/ containing the tracker's index.html and assets
      - name: Merge Mushroom Tracker into Dist
        run: |
          mkdir -p Personal-Website/dist/mushroom-tracker
          cp -r mushroom-tracker/dist/* Personal-Website/dist/mushroom-tracker/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Personal-Website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

